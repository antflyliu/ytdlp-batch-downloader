<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 视频监控</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/variables.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/form.css">
<link rel="stylesheet" href="/static/css/table.css">
<link rel="stylesheet" href="/static/css/modal.css">
<link rel="stylesheet" href="/static/css/toast.css">
<link rel="stylesheet" href="/static/css/drawer.css">
<link rel="stylesheet" href="/static/css/provider.css">
<link rel="stylesheet" href="/static/css/batch.css">
<link rel="stylesheet" href="/static/css/api-key.css">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<div class="app">
  <!-- 顶部栏 (extracted to templates/header.html) -->
  <div id="app-header"></div>

  <!-- 主内容 -->
  <main class="main">
    <!-- 统计卡片 -->
    <div class="card">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-label">监控账户</div>
          <div class="stat-value" id="statAccounts">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总扫描次数</div>
          <div class="stat-value" id="statScans">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">新增视频</div>
          <div class="stat-value" id="statNew">—</div>
        </div>
        <div class="stat-card" id="quotaCard" style="display:none">
          <div class="stat-label">API Quota</div>
          <div class="stat-value" id="statQuota">—</div>
          <div class="progress-bar" style="height:4px;background:var(--border);border-radius:2px;margin-top:4px">
            <div id="quotaBar" style="height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%"></div>
          </div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:2px" id="quotaSub">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">最后扫描</div>
          <div class="stat-value" id="statLast" style="font-size:14px">—</div>
        </div>
      </div>
    </div>

    <!-- 账户列表 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <div class="card-title-icon" style="background:var(--accent-dim);color:var(--accent)" aria-hidden="true">户</div>
          监控账户
        </div>
        <div class="actions">
          <div id="schedulerControls">
            <button class="btn btn-primary" onclick="openAddAccount()">+ 添加账户</button>
            <button class="btn btn-success" id="btnToggleScheduler" onclick="toggleScheduler()">▶ 启动监控</button>
          </div>
          <button class="btn btn-ghost" onclick="reloadJobs()">↻ 重载任务</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>名称</th>
              <th>频道 URL</th>
              <th>API Key</th>
              <th>模式</th>
              <th>间隔</th>
              <th>获取</th>
              <th>状态</th>
              <th>通知</th>
              <th>代理</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="accountsTable">
          </tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyAccounts" style="display:none">
        <div class="empty-icon" aria-hidden="true">—</div>
        <div class="empty-title">暂无监控账户</div>
        <div class="empty-desc">点击右上角「添加账户」开始监控 YouTube 频道</div>
        <button class="btn btn-primary" onclick="openAddAccount()">+ 添加第一个账户</button>
      </div>
    </div>

    <!-- 扫描日志 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <div class="card-title-icon" style="background:var(--success-dim);color:var(--success)" aria-hidden="true">事</div>
          扫描事件日志
        </div>
        <div style="font-size:11px;color:var(--text-dim)" id="eventCount">最近 20 条</div>
      </div>
      <div class="card-body">
        <div class="log-area" id="logArea">
          <div class="empty-state" style="padding:24px">
            <div class="empty-title" style="font-size:13px">暂无扫描记录</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 模态: 添加/编辑账户 -->
<div id="tpl-modal-account"></div>

<!-- 模态: 固定代理管理 -->
<div id="tpl-modal-proxy-pools"></div>

<!-- 模态: 添加/编辑固定代理 -->
<div id="tpl-modal-proxy-pool-form"></div>

<!-- 全屏: 视频详情 -->
<div id="tpl-modal-video-detail"></div>

<!-- 模态: 立即扫描确认 -->
<div id="tpl-modal-scan-confirm"></div>

<!-- 模态: 通用确认（替代原生 confirm） -->
<div id="tpl-modal-confirm"></div>

<!-- 模态: API Key 管理 -->
<div id="tpl-modal-api-keys"></div>

<!-- 模态: 添加/编辑 API Key -->
<div id="tpl-modal-api-key-form"></div>

<!-- 模态: API 缓存管理 -->
<div id="tpl-modal-cache"></div>

<!-- 模态: 全局配置 -->
<div id="tpl-modal-config"></div>

<!-- 模态: 动态代理提供方管理 -->
<div id="tpl-modal-dynamic-providers"></div>

<!-- 提供方运行详情抽屉 -->
<div id="tpl-dyn-provider-detail-drawer"></div>

<!-- 模态: 添加/编辑动态代理提供方 -->
<div id="tpl-modal-dynamic-provider-form"></div>

<!-- 批量下载弹窗样式已提取到 static/css/ (batch.css + components.css 聚合) -->
<div id="tpl-modal-batch-download"></div>

<!-- Toast 容器 -->
<div class="toast-container" id="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
