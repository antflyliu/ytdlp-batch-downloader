<!-- 提供方运行详情抽屉 -->
<div class="modal-overlay" id="dynProviderDetailDrawer" style="display:none;background:rgba(10,11,17,0.48)">
  <div class="modal" style="max-width:560px;height:88vh;display:flex;flex-direction:column;margin-left:auto;margin-right:24px;background:#141413;border:1px solid rgba(232,230,220,0.12);box-shadow:0 24px 80px rgba(0,0,0,0.45)">
    <div class="modal-header" style="border-bottom:1px solid rgba(232,230,220,0.10)">
      <div class="modal-title" style="font-family:Georgia,serif;color:#f5f4ed">提供方运行详情</div>
      <button class="modal-close" onclick="closeDynamicProviderDetail()">✕</button>
    </div>
    <div class="modal-body" style="flex:1;overflow:auto">
      <div id="dynProviderDetailError" style="display:none;margin-bottom:12px;padding:12px 14px;border-radius:14px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.14);color:#fecaca;font-size:12px;line-height:1.6"></div>
      <div id="dynProviderDetailPreviewSummary" style="display:none;margin-bottom:12px;padding:12px 14px;border-radius:14px;background:rgba(34,197,94,0.06);border:1px solid rgba(232,230,220,0.10);color:#d6d3d1;font-size:12px;line-height:1.6"></div>
      <div id="dynProviderDetailFailures" style="display:none;margin-bottom:12px;padding:12px 14px;border-radius:14px;background:rgba(250,204,21,0.07);border:1px solid rgba(250,204,21,0.14);color:#fde68a;font-size:12px;line-height:1.6">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
          <strong style="display:block;color:#fef3c7">最近失败原因</strong>
          <button id="dynProviderDetailFailuresToggle" class="btn-sm" style="padding:4px 8px;font-size:10px" onclick="toggleProviderFailureList()">展开</button>
        </div>
        <div id="dynProviderDetailFailuresList"></div>
      </div>
      <div id="dynProviderDetailActions" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
      <div id="dynProviderDetailBody"></div>
    </div>
  </div>
</div>
