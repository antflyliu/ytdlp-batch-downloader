<!-- 模态: 添加/编辑 API Key（结构与「添加监控账户」弹框一致） -->
<div class="modal-overlay modal-overlay--account" id="modalApiKeyForm" role="dialog" aria-modal="true" aria-labelledby="modalApiKeyFormTitle">
  <div class="modal modal--account">
    <div class="modal-header">
      <div class="modal-title" id="modalApiKeyFormTitle" data-i18n="apiKeyForm.addTitle">新增 API Key</div>
      <button type="button" class="modal-close" onclick="closeModal('modalApiKeyForm')" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="akId">
      <div class="form-group">
        <label class="form-label" for="akName" data-i18n="apiKeyForm.keyName">Key 名称</label>
        <input class="form-input" id="akName" data-i18n-placeholder="apiKeyForm.keyNamePlaceholder" placeholder="例如：主号专用" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="akValue" data-i18n="apiKeyForm.keyValue">API Key 值</label>
        <input class="form-input" id="akValue" placeholder="AIzaSy..." autocomplete="off" spellcheck="false" style="font-family:var(--mono);font-size:12px;letter-spacing:0.5px">
        <div class="form-hint" id="akValueHint" data-i18n="apiKeyForm.keyValueHint">YouTube Data API v3 的实际 Key 值，安全存储于本地数据库</div>
      </div>
      <hr class="form-sep">
      <div class="form-row ak-api-key-quota-row">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="akQuota" data-i18n="apiKeyForm.quota">每日配额上限</label>
          <input class="form-input" id="akQuota" type="number" value="10000" min="100" max="100000" placeholder="10000">
          <div class="form-hint" data-i18n="apiKeyForm.quotaHint">超过后该 Key 暂停扫描</div>
        </div>
        <div class="form-group ak-api-key-active-col" style="margin-bottom:0">
          <span class="form-label ak-api-key-active-spacer" aria-hidden="true">&nbsp;</span>
          <label class="checkbox-label">
            <input type="checkbox" id="akActive" checked>
            <span class="checkbox-box"></span>
            <span data-i18n="apiKeyForm.enableKey">启用此 Key</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" onclick="closeModal('modalApiKeyForm')" data-i18n="common.cancel">取消</button>
      <button type="button" class="btn btn-primary" onclick="saveApiKey()" data-i18n="common.save">保存</button>
    </div>
  </div>
</div>
