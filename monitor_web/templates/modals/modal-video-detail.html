<!-- 视频详情：与切片任务详情同系 — 居中暖色卡片 + 毛玻璃遮罩 -->
<div class="modal-overlay" id="modalVideoDetail" role="dialog" aria-modal="true" aria-labelledby="vdModalTitle">
  <div class="modal modal-video-detail">
    <div class="mvd-header">
      <div class="mvd-header-left">
        <div class="mvd-eyebrow"><span id="vdAccountEyebrow">监控账户</span><span id="vdAccountName" class="mvd-account-name"></span></div>
        <h2 class="mvd-title" id="vdModalTitle">视频详情</h2>
        <div class="mvd-meta">
          <span class="mvd-kbd">ESC 关闭</span>
          <span class="mvd-dot" aria-hidden="true"></span>
          <span id="vdTotal" class="mvd-meta-item">共 — 条</span>
        </div>
      </div>
      <div class="mvd-header-actions">
        <button type="button" class="btn btn-sm btn-primary" id="vdBatchBtn" onclick="vdBatchDownload()" disabled>下载选中 (<span id="vdSelCount">0</span>)</button>
        <button type="button" class="ccd-close" onclick="closeModal('modalVideoDetail')" aria-label="关闭"><span aria-hidden="true">×</span></button>
      </div>
    </div>
    <div class="modal-body mvd-body">
      <!-- 工具栏 -->
      <div class="vd-modal-toolbar mvd-toolbar">
        <input class="form-input" id="vdTitleSearch" placeholder="搜索标题..." style="width:220px" onkeydown="if(event.key==='Enter')vdSearch()">
        <input class="form-input" id="vdUrlSearch" placeholder="搜索链接..." style="width:220px" onkeydown="if(event.key==='Enter')vdSearch()">
        <select class="form-input" id="vdSortBy" style="width:140px" onchange="vdSearch()">
          <option value="published_at">发布时间</option>
          <option value="view_count">浏览量</option>
          <option value="like_count">点赞数</option>
          <option value="comment_count">评论数</option>
        </select>
        <select class="form-input" id="vdSortDir" style="width:90px" onchange="vdSearch()">
          <option value="desc">降序</option>
          <option value="asc">升序</option>
        </select>
        <button type="button" class="btn btn-sm" onclick="vdSearch()">搜索</button>
        <button type="button" class="btn btn-sm" onclick="vdClearFilters()" style="color:var(--text-dim)">重置</button>
        <label class="vd-toolbar-spacer" style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" id="vdSubToggle" onchange="_updateVdSubLabelText()">
          <span id="vdSubLabel">字幕:否</span>
        </label>
      </div>
      <!-- 下载进度条 -->
      <div class="vd-dl-bar" id="vdDlBar">
        <div class="dl-info">
          <span id="vdDlLabel">准备下载...</span>
          <span id="vdDlPercent">0%</span>
        </div>
        <div class="dl-track"><div class="dl-fill" id="vdDlFill" style="width:0%"></div></div>
        <div class="dl-status" id="vdDlStatus"></div>
      </div>
      <!-- 表格 -->
      <div style="flex:1;overflow:auto;min-height:0">
        <table class="vd-table">
          <thead>
            <tr>
              <th style="width:40px"><input type="checkbox" id="vdCheckAll" onchange="vdToggleAll(this)"></th>
              <th>标题</th>
              <th style="width:90px">发布时间</th>
              <th style="width:80px">时长</th>
              <th style="width:90px">浏览量</th>
              <th style="width:70px">点赞</th>
              <th style="width:70px">评论</th>
              <th style="width:90px">下载状态</th>
              <th style="width:50px">操作</th>
            </tr>
          </thead>
          <tbody id="vdTbody"></tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div class="vd-modal-toolbar vd-modal-toolbar--footer mvd-footer">
        <button type="button" class="btn btn-sm" id="vdPrevBtn" onclick="vdGoPage(-1)">‹ 上一页</button>
        <span id="vdPageInfo" class="mvd-meta-item"></span>
        <button type="button" class="btn btn-sm" id="vdNextBtn" onclick="vdGoPage(1)">下一页 ›</button>
        <select class="form-input" id="vdPageSize" style="width:80px;font-size:12px" onchange="vdChangePageSize()">
          <option value="20">20/页</option>
          <option value="50">50/页</option>
          <option value="100">100/页</option>
        </select>
      </div>
    </div>
  </div>
</div>
