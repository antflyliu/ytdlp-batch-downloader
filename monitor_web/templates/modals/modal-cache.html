<!-- 模态: API 缓存管理 -->
<div class="modal-overlay" id="modalCache">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <div class="modal-title">API 缓存管理</div>
      <button class="modal-close" onclick="closeModal('modalCache')">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">
        缓存 handle → channel_id + uploads_playlist_id，命中后扫描 <strong>0 API units</strong>。
        删除缓存后下次扫描会重新调用 API（1 unit）。
      </p>
      <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">
        <input class="form-input" id="cacheHandle" placeholder="输入 @handle 或频道 URL" style="flex:1">
        <input class="form-input" id="cacheApiKey" placeholder="YouTube API Key" style="width:200px">
        <button class="btn btn-sm info" onclick="refreshCacheItem()">刷新缓存</button>
      </div>
      <div id="cacheList" style="max-height:320px;overflow-y:auto"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm danger" onclick="clearAllCache()">清空所有缓存</button>
      <button class="btn btn-ghost" onclick="closeModal('modalCache')">关闭</button>
    </div>
  </div>
</div>
