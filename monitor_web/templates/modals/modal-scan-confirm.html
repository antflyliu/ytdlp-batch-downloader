<!-- 模态: 立即扫描确认（与 modalAppConfirm 同款 sheet：全屏遮罩 + 居中卡片） -->
<div class="modal-overlay modal-overlay--account" id="modalScanConfirm" role="dialog" aria-modal="true" aria-labelledby="modalScanConfirmTitle">
  <div class="modal modal--account">
    <div class="modal-header">
      <div class="modal-title" id="modalScanConfirmTitle" data-i18n="scanConfirm.title">立即扫描</div>
      <button type="button" class="modal-close" onclick="closeScanConfirm()" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body modal-app-confirm-body">
      <p class="modal-confirm-desc" data-i18n="scanConfirm.confirmMsg">确认立即扫描当前账户？</p>
      <div class="modal-confirm-checkbox-row">
        <label class="checkbox-label modal-confirm-checkbox">
          <input type="checkbox" id="scanNowAutoDownload" checked>
          <span class="checkbox-box"></span>
          <span data-i18n="scanConfirm.autoDl">扫描到新视频后立即下载</span>
        </label>
        <div class="form-hint modal-confirm-checkbox-hint" data-i18n="scanConfirm.autoDlHint">扫描完成后自动开始下载，最多 2 个视频同时下载。</div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" onclick="closeScanConfirm()" data-i18n="common.cancel">取消</button>
      <button type="button" class="btn btn-primary" onclick="confirmScanNow()" data-i18n="scanConfirm.startScan">开始扫描</button>
    </div>
  </div>
</div>
