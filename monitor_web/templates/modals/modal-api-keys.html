<!-- 模态: API Key 管理 -->
<div class="modal-overlay" id="modalApiKeys">
  <div class="modal" style="max-width:760px">
    <div class="modal-header">
      <div class="modal-title" style="display:flex;align-items:center;gap:10px">
        <div class="card-title-icon" style="background:var(--accent-dim);color:var(--accent)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <span data-i18n="apiKeys.title">API Key 管理</span>
      </div>
      <button class="modal-close" onclick="closeModal('modalApiKeys')">✕</button>
    </div>
    <div class="modal-body" style="padding:16px 20px">
      <!-- 工具栏 -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px 16px;background:var(--surface2);border-radius:10px;border:1px solid var(--border)">
        <button class="btn btn-primary" onclick="openAddApiKey()" style="flex-shrink:0">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="apiKeys.addNew">新增 Key</span>
        </button>
        <div style="width:1px;height:20px;background:var(--border)"></div>
        <span style="font-size:12px;color:var(--text-dim)" data-i18n="apiKeys.hint">每个 Key 可独立设置每日配额上限，账户可选择使用哪个 Key。未指定时自动使用系统默认 Key。</span>
      </div>
      <!-- Key 卡片列表 -->
      <div id="apiKeysList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modalApiKeys')" data-i18n="common.close">关闭</button>
    </div>
  </div>
</div>
