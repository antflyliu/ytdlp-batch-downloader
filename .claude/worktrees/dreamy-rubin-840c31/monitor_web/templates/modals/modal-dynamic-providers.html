<!-- 模态: 动态代理提供方管理（遮罩与圆角卡片与账户管理等 sheet 一致） -->
<div class="modal-overlay" id="modalDynamicProviders">
  <div class="modal modal--account modal--dynamic-providers">
    <div class="modal-header">
      <div class="modal-title" data-i18n="dynProviders.title">动态代理提供方</div>
      <button type="button" class="modal-close" onclick="closeModal('modalDynamicProviders')">✕</button>
    </div>
    <div class="modal-body">
      <div class="dyn-toolbar-row dyn-modal-toolbar">
        <div class="dyn-toolbar-left" style="flex:1 1 320px;display:block">
          <div class="dyn-modal-lead__title" data-i18n="dynProviders.workbench">动态代理调度工作台</div>
          <div class="dyn-modal-lead__desc" data-i18n-html="dynProviders.workbenchDesc">仅管理列表拉取型提供方的 refresh / cleanup / run-once，不影响监控账户扫描事件。<strong style="color:var(--text);font-weight:600">Provider Scheduler 不会随页面打开自动启动</strong>，需点击「启动动态代理调度」。</div>
        </div>
        <div class="dyn-modal-scheduler-card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">
            <div class="dyn-modal-scheduler-card__kicker">Provider Scheduler</div>
            <span id="dynProviderSchedulerBadgeModal" class="tag tag--warning" data-dyn-scheduler-badge data-i18n="dynProviders.notStarted">未启动</span>
          </div>
          <div id="dynSchedulerHintModal" data-dyn-scheduler-hint style="font-size:12px;color:var(--text-muted);line-height:1.55;margin-bottom:12px">调度器未运行：刷新间隔不会自动生效</div>
          <div id="dynProviderNextRunModal" data-dyn-scheduler-next style="font-size:11px;color:var(--text-dim);line-height:1.5">下一次执行：—</div>
        </div>
        <div class="dyn-toolbar-right dyn-scheduler-card__toolbar" style="align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
            <button type="button" class="btn btn--sm btn--success" id="btnDynProviderSchedulerToggleModal" data-dyn-scheduler-toggle data-dyn-scheduler-primary onclick="toggleDynamicProviderScheduler()">启动动态代理调度</button>
            <button type="button" class="btn btn--sm btn--ghost" onclick="reloadDynamicProviderJobs()" data-i18n="dynProviders.reloadDynamicProxyJobs">重载动态代理任务</button>
            <button type="button" class="btn btn--sm btn--ghost" onclick="runDynamicProviderJobsOnce()" data-i18n="dynProviders.refreshAllListApisNow">立即刷新全部列表 API</button>
            <button type="button" class="btn btn--sm btn--ghost" onclick="healthCheckAllProviders()">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              <span data-i18n="dynProviders.healthCheckAll">全量健康检查</span>
            </button>
            <button type="button" class="btn btn--sm btn--primary" onclick="openAddDynamicProvider()" data-i18n="dynProviders.addProvider">+ 添加提供方</button>
          </div>
        </div>
      </div>

      <div class="dyn-scheduler-stack" role="region" aria-label="调度执行记录与说明" style="margin-bottom:16px">
        <div class="card dyn-collapse">
          <button type="button" class="dyn-collapse__trigger" aria-expanded="false" aria-controls="dynSchedulerLogsPanelModal" onclick="toggleDynCollapse(this)">
            <span class="dyn-collapse__trigger-main">
              <span class="dyn-collapse__chevron" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </span>
              <span class="card-title-icon" style="background:var(--accent-dim);color:var(--accent)" aria-hidden="true">📋</span>
              <span class="dyn-collapse__label" data-i18n="dynProviders.recentExec">最近调度执行</span>
            </span>
            <span class="dyn-collapse__hint" data-i18n="dynProviders.execHint">独立于 monitor_events · 展开后筛选</span>
          </button>
          <div id="dynSchedulerLogsPanelModal" class="dyn-collapse__panel" hidden>
            <div class="dyn-collapse__toolbar">
              <label class="dyn-collapse__filter-label" for="dynProviderLogFilterModal" data-i18n="dynProviders.logTypeLabel">日志类型</label>
              <select id="dynProviderLogFilterModal" class="form-input dyn-collapse__filter" data-dyn-log-filter onchange="syncDynLogFilters(this); loadProviderSchedulerLogs();">
                <option value="all" data-i18n="dynProviders.logAll">全部日志</option>
                <option value="refresh" data-i18n="dynProviders.logRefresh">仅 refresh</option>
                <option value="cleanup" data-i18n="dynProviders.logCleanup">仅 cleanup</option>
                <option value="error" data-i18n="dynProviders.logError">仅 error</option>
              </select>
            </div>
            <div data-dyn-scheduler-logs class="dyn-scheduler-card-scroll dyn-scheduler-logs-shell" style="max-height:240px"></div>
          </div>
        </div>

        <div class="card dyn-collapse">
          <button type="button" class="dyn-collapse__trigger" aria-expanded="false" aria-controls="dynSchedulerHelpPanelModal" onclick="toggleDynCollapse(this)">
            <span class="dyn-collapse__trigger-main">
              <span class="dyn-collapse__chevron" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </span>
              <span class="card-title-icon" style="background:var(--surface2);color:var(--text-muted)" aria-hidden="true">📖</span>
              <span class="dyn-collapse__label" data-i18n="dynProviders.schedulerDesc">调度说明</span>
            </span>
            <span class="dyn-collapse__hint" data-i18n="dynProviders.schedulerDescHint">任务注册与按钮含义</span>
          </button>
          <div id="dynSchedulerHelpPanelModal" class="dyn-collapse__panel" hidden>
            <div class="dyn-scheduler-help-body dyn-scheduler-help-body--light">
              <p data-i18n-html="dynProviders.helpText1"></p>
              <p data-i18n-html="dynProviders.helpText2"></p>
              <p data-i18n-html="dynProviders.helpText3"></p>
              <p data-i18n-html="dynProviders.helpText4"></p>
              <p data-i18n-html="dynProviders.helpText5"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="dyn-provider-list-toolbar card-account-search">
        <input type="search" id="dynProviderSearchModal" class="form-input dyn-provider-search-input" data-i18n-placeholder="page.dynamicProviders.searchPlaceholder" placeholder="搜索名称、ID、适配器类型…" autocomplete="off" aria-label="筛选提供方" />
        <span id="dynProviderListSummaryModal" class="dyn-provider-list-summary" aria-live="polite"></span>
      </div>
      <div class="dyn-table-shell table-wrap--accounts">
        <table class="dyn-table accounts-table dyn-provider-table" id="dynProviderTable">
          <thead>
            <tr>
              <th style="width:36px" data-i18n="dynProviders.thId">ID</th>
              <th data-i18n="dynProviders.thName">名称</th>
              <th data-i18n="dynProviders.thBilling">计费</th>
              <th data-i18n="dynProviders.thAdapter">适配器</th>
              <th data-i18n="dynProviders.thHealth">健康状态</th>
              <th data-i18n="dynProviders.thPriority">优先级</th>
              <th data-i18n="dynProviders.thFeatures">功能</th>
              <th data-i18n="dynProviders.thActions">操作</th>
            </tr>
          </thead>
          <tbody id="dynProviderTableBody">
          </tbody>
        </table>
      </div>
      <div id="dynProviderPaginationModal" class="dyn-provider-pagination" style="display:none">
        <button type="button" class="btn btn--sm btn--ghost" id="dynProviderPrevModal" onclick="dynProviderGoPage('modal', -1)">‹ 上一页</button>
        <span id="dynProviderPageInfoModal" class="dyn-provider-page-info"></span>
        <button type="button" class="btn btn--sm btn--ghost" id="dynProviderNextModal" onclick="dynProviderGoPage('modal', 1)">下一页 ›</button>
      </div>
      <div id="dynEmptyState" class="dyn-empty" style="display:none">
        <div class="dyn-empty-title" data-i18n="dynProviders.emptyTitle">还没有配置动态代理提供方</div>
        <div class="dyn-empty-desc" data-i18n="dynProviders.emptyDesc">添加一个提供方后，它将参与系统动态代理路由决策。付费提供方优先，免费提供方兜底。</div>
        <div class="dyn-empty-cta">
          <button class="btn btn-sm dyn-empty-primary" onclick="openAddDynamicProvider()" data-i18n="dynProviders.addFirst">+ 添加第一个提供方</button>
          <span class="dyn-note" data-i18n="dynProviders.addFirstNote">提供方按优先级从低到高依次尝试</span>
        </div>
      </div>
    </div>
  </div>
</div>
