<!-- 全屏: 切片历史 -->
<div class="modal-overlay" id="modalClipHistory">
  <div class="modal" style="max-width:960px;max-height:90vh">
    <div class="modal-header">
      <div class="modal-title" data-i18n="clipHistory.title">✂ 切片管理</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="chTotal" style="font-size:12px;color:var(--text-muted);margin-right:4px"></span>
        <button class="modal-close" onclick="closeModal('modalClipHistory')">✕</button>
      </div>
    </div>
    <div class="modal-body" style="padding:0;display:flex;flex-direction:column;min-height:0">
      <!-- 过滤栏 -->
      <div style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0">
        <select class="form-input" id="chAccountFilter" style="width:160px" onchange="chLoad()">
          <option value="" data-i18n="clipHistory.allAccounts">全部账户</option>
        </select>
        <select class="form-input" id="chStatusFilter" style="width:120px" onchange="chLoad()">
          <option value="" data-i18n="clipHistory.allStatus">全部状态</option>
          <option value="pending" data-i18n="clipHistory.pending">等待中</option>
          <option value="running" data-i18n="clipHistory.running">进行中</option>
          <option value="done" data-i18n="clipHistory.done">已完成</option>
          <option value="error" data-i18n="clipHistory.failed">失败</option>
        </select>
        <button class="btn btn-sm" onclick="chLoad()" data-i18n="clipHistory.refresh">刷新</button>
      </div>
      <!-- 任务列表 -->
      <div style="flex:1;overflow:auto;min-height:0">
        <table class="vd-table" style="width:100%">
          <thead>
            <tr>
              <th style="width:40px" data-i18n="clipHistory.thId">ID</th>
              <th style="width:120px" data-i18n="clipHistory.thAccount">账户</th>
              <th data-i18n="clipHistory.thVideoTitle">视频标题</th>
              <th style="width:70px" data-i18n="clipHistory.thStatus">状态</th>
              <th style="width:50px" data-i18n="clipHistory.thClips">切片</th>
              <th style="width:50px" data-i18n="clipHistory.thCollections">合集</th>
              <th style="width:140px" data-i18n="clipHistory.thCreatedAt">创建时间</th>
              <th style="width:50px" data-i18n="clipHistory.thActions">操作</th>
            </tr>
          </thead>
          <tbody id="chTbody"></tbody>
        </table>
        <div id="chEmpty" style="display:none;padding:40px;text-align:center;color:var(--text-muted)" data-i18n="clipHistory.noData">
          暂无切片任务
        </div>
        <div id="chLoading" style="display:none;padding:40px;text-align:center;color:var(--text-muted)" data-i18n="clipHistory.loading">
          加载中...
        </div>
      </div>
      <!-- 分页 -->
      <div id="chPagination" style="padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0">
        <button class="btn btn-sm" id="chPrevBtn" onclick="chGoPage(-1)" data-i18n="clipHistory.prevPage">‹ 上一页</button>
        <span id="chPageInfo" style="font-size:12px;color:var(--text-muted)"></span>
        <button class="btn btn-sm" id="chNextBtn" onclick="chGoPage(1)" data-i18n="clipHistory.nextPage">下一页 ›</button>
      </div>
    </div>
  </div>
</div>
