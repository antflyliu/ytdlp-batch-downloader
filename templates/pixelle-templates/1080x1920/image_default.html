<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelle Compatible Image Template</title>
  <style>
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      background: #f6efe7;
      color: #2f2823;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    .frame {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 72px;
      box-sizing: border-box;
      gap: 40px;
    }
    .image {
      border: 2px solid rgba(70, 57, 48, .18);
      background: #e7d8c8;
      background-image: var(--image-url);
      background-size: cover;
      background-position: center;
    }
    .caption {
      font-size: 54px;
      line-height: 1.24;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="image" aria-label="Scene image">{{IMAGE_0}}</section>
    <section class="caption">{{TEXT_0}}</section>
  </main>
</body>
</html>
